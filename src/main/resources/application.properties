spring.application.name=job-processing-engine

# PostgreSQL datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/job_engine}
spring.datasource.username=${DB_USERNAME:job_engine_user}
spring.datasource.password=${DB_PASSWORD:job_engine_dev_only}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Database migrations
spring.flyway.enabled=true

# Health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.port=8080

# Job engine configuration
job-engine.polling-interval-ms=30000
job-engine.worker-pool-size=10
job-engine.max-jobs-per-poll=10
job-engine.default-max-attempts=3
